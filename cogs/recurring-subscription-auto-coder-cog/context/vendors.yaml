# Vendor list: merchant -> vendor id, category and billing.
#
# SHARED WITH chase-list-builder-cog. Keep the two copies identical.
#
# EMPTY BY DEFAULT. The Cog ships with no vendor list; real ones belong in an
# override folder outside the repo (see --context and tools/vendors_to_yaml.py).
# With no list, every merchant is identified by Brex's Merchant Name and counts
# as a subscription when Brex's category is one of those below.
#
# Entry forms, when a list is given:
#   - {name: Datadog, billing: usage}
#   - {name: Notion, billing: fixed}
#   - {name: Uber, category: travel}
#   - {id: aws, patterns: ['^AWS ', 'AMAZON WEB SERVICES']}
# `billing: usage` means the amount varies (a change is flagged, not blocked);
# `billing: fixed` sends a change to a person. Unset means usage.
version: "1"
status: empty

# Merchants not on the list count as subscriptions when Brex's category is one of these.
brex_subscription_categories:
  - Recurring software & SaaS

vendors: []
