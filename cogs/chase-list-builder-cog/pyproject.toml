[project]
name = "chase-list"
version = "0.0.1"
requires-python = ">=3.11"
# pyyaml comes from conda-forge via pixi.toml; listed here so a pip install works too.
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chase_list", "src/cog_transactions"]
